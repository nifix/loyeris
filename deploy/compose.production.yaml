name: loyeris

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  HttpsRedirection__Enabled: "true"
  AllowedHosts: ${APP_DOMAIN:?APP_DOMAIN is required}
  ConnectionStrings__LoyerisDatabase: Host=db;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  ApplicationUrls__FrontendBaseUrl: https://${APP_DOMAIN}
  Jwt__Issuer: ${JWT_ISSUER:-Loyeris.Api}
  Jwt__Audience: ${JWT_AUDIENCE:-Loyeris.App}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
  Jwt__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
  Jwt__RefreshTokenLifetimeHours: ${JWT_REFRESH_TOKEN_LIFETIME_HOURS:-24}
  Jwt__PersistentRefreshTokenLifetimeDays: ${JWT_PERSISTENT_REFRESH_TOKEN_LIFETIME_DAYS:-30}
  Jwt__RefreshCookieName: ${JWT_REFRESH_COOKIE_NAME:-loyeris.refresh_token}
  Smtp__Host: ${SMTP_HOST:?SMTP_HOST is required}
  Smtp__Port: ${SMTP_PORT:-587}
  Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
  Smtp__FromAddress: ${SMTP_FROM_ADDRESS:?SMTP_FROM_ADDRESS is required}
  Smtp__FromName: ${SMTP_FROM_NAME:-Loyeris}
  Smtp__Username: ${SMTP_USERNAME:-}
  Smtp__Password: ${SMTP_PASSWORD:-}

services:
  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - data

  migrations:
    image: ghcr.io/nifix/loyeris-api:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["--migrate"]
    restart: "no"
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    networks:
      - data

  api:
    image: ghcr.io/nifix/loyeris-api:${IMAGE_TAG}
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--header", "X-Forwarded-Proto: https", "http://localhost:8080/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *default-logging
    networks:
      - app
      - data

  web:
    image: ghcr.io/nifix/loyeris-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_SITE_ADDRESS: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    networks:
      - app

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  app:
  data:
    internal: true
