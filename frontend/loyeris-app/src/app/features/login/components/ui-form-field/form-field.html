<div class="form-control w-full">
  <div class="label px-1 pb-1.5">
    <label class="label-text font-semibold text-base-content/80" [for]="fieldId()">
      {{ label() }}
    </label>
    @if (forgotLabel()) {
      @if (forgotUrl().startsWith('/')) {
        <a [routerLink]="forgotUrl()" class="label-text-alt link link-primary text-sm font-medium">
          {{ forgotLabel() }}
        </a>
      } @else {
        <a [href]="forgotUrl()" class="label-text-alt link link-primary text-sm font-medium">
          {{ forgotLabel() }}
        </a>
      }
    }
  </div>
  <label
    class="input input-bordered group flex h-12 w-full min-w-0 max-w-full items-center gap-3 rounded-xl transition-all focus-within:border-primary"
    [class.input-error]="errorMessage()"
    [for]="fieldId()"
  >
    @if (type() === 'text') {
      <svg
        class="shrink-0 text-base-content/40 transition-colors group-focus-within:text-primary"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M20 21a8 8 0 0 0-16 0" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    } @else if (type() === 'email') {
      <svg
        class="shrink-0 text-base-content/40 transition-colors group-focus-within:text-primary"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect width="20" height="16" x="2" y="4" rx="2" />
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
      </svg>
    } @else if (type() === 'password') {
      <svg
        class="shrink-0 text-base-content/40 transition-colors group-focus-within:text-primary"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect width="18" height="11" x="3" y="11" rx="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
    }
    <input
      class="min-w-0 grow bg-transparent outline-none"
      [autocomplete]="autocomplete()"
      [attr.aria-describedby]="errorMessage() ? fieldId() + '-error' : null"
      [attr.aria-invalid]="errorMessage() ? true : null"
      [disabled]="disabled()"
      [id]="fieldId()"
      [placeholder]="placeholder()"
      [required]="required()"
      [type]="type()"
      [value]="value()"
      (blur)="handleBlur()"
      (input)="handleInput($event)"
    />
  </label>
  @if (errorMessage()) {
    <p class="mt-1 px-1 text-xs font-medium text-error" [id]="fieldId() + '-error'">
      {{ errorMessage() }}
    </p>
  }
</div>
