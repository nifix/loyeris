<div
  class="grid gap-2 rounded-xl bg-base-200/60 px-4 py-3 sm:grid-cols-3"
  aria-label="Exigences du mot de passe"
  aria-live="polite"
  role="list"
>
  @for (requirement of requirements(); track requirement.label) {
    <p
      class="flex items-start gap-2 text-xs leading-5 text-base-content transition-opacity"
      [attr.aria-label]="requirement.label + (requirement.met ? ' : validée' : ' : non validée')"
      [attr.data-met]="requirement.met"
      [class.font-medium]="requirement.met"
      [class.opacity-50]="!requirement.met"
      role="listitem"
    >
      <svg
        class="mt-1 shrink-0 transition-colors"
        [class.text-primary]="requirement.met"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        [attr.stroke-width]="requirement.met ? 2.5 : 2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        @if (requirement.met) {
          <path d="m5 12 4 4L19 6" />
        } @else {
          <circle cx="12" cy="12" r="8" />
        }
      </svg>
      <span>{{ requirement.label }}</span>
    </p>
  }
</div>
