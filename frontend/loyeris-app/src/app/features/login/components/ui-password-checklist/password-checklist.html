<div
  class="grid gap-2 rounded-xl bg-base-200/60 px-4 py-3 sm:grid-cols-3"
  aria-label="Exigences du mot de passe"
>
  @for (requirement of requirements; track requirement) {
    <p class="flex items-start gap-2 text-xs leading-5 text-base-content/65">
      <svg
        class="mt-1 shrink-0 text-primary"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m5 12 4 4L19 6" />
      </svg>
      <span>{{ requirement }}</span>
    </p>
  }
</div>
