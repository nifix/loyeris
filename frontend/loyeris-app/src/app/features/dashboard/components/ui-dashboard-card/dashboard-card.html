<article class="card h-full rounded-lg border border-base-200 bg-base-100 shadow-sm">
  <div class="card-body h-full gap-5">
    <div class="flex items-start justify-between gap-4">
      <div>
        <h2 class="card-title text-xl">{{ title() }}</h2>
        <p class="text-sm leading-6 text-slate-500">{{ description() }}</p>
      </div>

      @if (linkLabel()) {
        <a class="btn btn-ghost btn-sm text-primary" [href]="linkUrl()">{{ linkLabel() }}</a>
      }
    </div>

    <ng-content />
  </div>
</article>
