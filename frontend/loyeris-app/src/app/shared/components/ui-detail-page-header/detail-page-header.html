<section class="detail-page-header card min-w-0 max-w-full rounded-lg border border-base-200 shadow-sm">
  <div class="card-body min-w-0 p-5 md:p-6">
    <div class="grid gap-6 xl:grid-cols-[minmax(0,1fr)_auto] xl:items-end">
      <div class="grid gap-3.5">
        <div class="flex flex-wrap items-center gap-3">
          <div class="badge badge-primary badge-outline">{{ badge() }}</div>
          <ui-status-badge [tone]="statusTone()">{{ status() }}</ui-status-badge>
        </div>
        <div>
          <h1 class="text-4xl font-bold text-slate-900">{{ title() }}</h1>
          <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-500">{{ description() }}</p>
        </div>
        <div class="flex flex-wrap gap-2">
          @for (chip of chips(); track chip) {
            <div class="detail-page-chip">{{ chip }}</div>
          }
        </div>
      </div>

      <div class="rounded-lg border border-slate-200/80 bg-white/95 p-4 shadow-sm">
        <div class="flex flex-wrap justify-end gap-2.5">
          <button type="button" class="btn btn-outline">{{ secondaryActionLabel() }}</button>
          @if (primaryActionUrl().startsWith('/')) {
            <a class="btn btn-primary" [routerLink]="primaryActionUrl()">{{ primaryActionLabel() }}</a>
          } @else {
            <a class="btn btn-primary" [href]="primaryActionUrl()">{{ primaryActionLabel() }}</a>
          }
        </div>
      </div>
    </div>
  </div>
</section>
