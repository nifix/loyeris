<section class="page-header card rounded-lg border border-base-200 shadow-sm">
  <div class="card-body p-5 md:p-6">
    <div class="page-header-copy">
      <div class="badge badge-primary badge-outline">{{ badge() }}</div>
      <div>
        <h1 class="text-4xl font-bold text-slate-900">{{ title() }}</h1>
        <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-500">{{ description() }}</p>
      </div>
      <div class="page-header-meta">
        @for (chip of chips(); track chip) {
          <div class="page-header-chip">{{ chip }}</div>
        }
      </div>
    </div>

    @if (actionLabel()) {
      <div class="page-toolbar">
        <button type="button" class="btn btn-sm btn-primary">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            class="h-4 w-4"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          {{ actionLabel() }}
        </button>
      </div>
    }
  </div>
</section>
