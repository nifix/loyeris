name: CI et images Docker

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and audit
        run: dotnet restore backend/Loyeris.slnx /warnaserror:NU1903,NU1904

      - name: Build
        run: dotnet build backend/Loyeris.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test backend/Loyeris.Tests/Loyeris.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults/backend

      - name: Publish backend test report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Backend unit tests
          path: TestResults/backend/*.trx
          reporter: dotnet-trx
          use-actions-summary: true
          only-summary: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
    defaults:
      run:
        working-directory: frontend/loyeris-app
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.15.0
          cache: yarn
          cache-dependency-path: frontend/loyeris-app/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Test
        run: >-
          yarn test
          --watch=false
          --reporters=junit
          --reporters=default
          --output-file=TestResults/vitest-junit.xml

      - name: Publish frontend test report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Frontend unit tests
          path: frontend/loyeris-app/TestResults/vitest-junit.xml
          reporter: java-junit
          use-actions-summary: true
          only-summary: true

      - name: Build application
        run: yarn build

      - name: Build Storybook
        run: yarn build-storybook

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate local manifest
        run: docker compose --env-file .env.example config --quiet

      - name: Validate development manifest
        run: docker compose --env-file .env.example --file compose.dev.yaml config --quiet

      - name: Validate production manifest
        env:
          IMAGE_TAG: 0000000000000000000000000000000000000000
        run: docker compose --env-file deploy/.env.production.example --file deploy/compose.production.yaml config --quiet

  docker-smoke:
    name: Docker smoke test
    needs:
      - backend
      - frontend
      - compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Pull external service images with retries
        run: |
          for attempt in 1 2 3 4; do
            if docker compose --env-file .env.example pull db maildev; then
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo 'Unable to pull PostgreSQL or MailDev after four attempts.' >&2
              exit 1
            fi

            delay=$((attempt * 15))
            echo "Docker Hub pull failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done

      - name: Build and start the complete stack
        run: >-
          docker compose --env-file .env.example up
          --detach
          --build
          --pull never
          --wait
          --wait-timeout 240

      - name: Verify liveness, readiness and SPA fallback
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/health/live
          curl --fail --silent --show-error http://localhost:8080/api/health/ready
          curl --fail --silent --show-error http://localhost:8080/login | grep --quiet '<app-root'
          curl --fail --silent --show-error http://localhost:8080/scis | grep --quiet '<app-root'

      - name: Verify account email delivery through MailDev
        run: |
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"firstName":"Intégration","lastName":"Continue","email":"ci@loyeris.local","password":"Loyeris-CI-2026!","termsAccepted":true}' \
            http://localhost:8080/api/identity-access/accounts

          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:1080/api/email | grep --quiet 'ci@loyeris.local'; then
              exit 0
            fi
            sleep 2
          done

          echo 'MailDev did not receive the account verification email.' >&2
          exit 1

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  production:
    name: Deploy production (disabled)
    # Replace this condition with the main-branch condition once the VPS is ready.
    if: ${{ false }}
    needs:
      - docker-smoke
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nifix/loyeris-api:${{ github.sha }}
            ghcr.io/nifix/loyeris-api:latest
          cache-from: type=gha,scope=loyeris-api
          cache-to: type=gha,mode=max,scope=loyeris-api

      - name: Build and publish web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend/loyeris-app
          file: ./frontend/loyeris-app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/nifix/loyeris-web:${{ github.sha }}
            ghcr.io/nifix/loyeris-web:latest
          cache-from: type=gha,scope=loyeris-web
          cache-to: type=gha,mode=max,scope=loyeris-web

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install --directory --mode 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Transfer production files and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          scp -o BatchMode=yes \
            deploy/compose.production.yaml \
            deploy/deploy.sh \
            "$remote:/opt/loyeris/"

          cleanup() {
            ssh -o BatchMode=yes "$remote" 'docker logout ghcr.io' || true
          }
          trap cleanup EXIT

          printf '%s' "$GHCR_TOKEN" | \
            ssh -o BatchMode=yes "$remote" \
              "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          ssh -o BatchMode=yes "$remote" \
            "chmod 700 /opt/loyeris/deploy.sh && /opt/loyeris/deploy.sh '$GITHUB_SHA'"
