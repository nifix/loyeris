name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Restore and audit
        run: dotnet restore backend/Loyeris.slnx /warnaserror:NU1903,NU1904

      - name: Build
        run: dotnet build backend/Loyeris.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test backend/Loyeris.Tests/Loyeris.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory TestResults/backend

      - name: Publish backend test report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Backend unit tests
          path: TestResults/backend/*.trx
          reporter: dotnet-trx
          use-actions-summary: true
          only-summary: true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
    defaults:
      run:
        working-directory: frontend/loyeris-app
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.15.0
          cache: yarn
          cache-dependency-path: frontend/loyeris-app/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Test
        run: >-
          yarn test
          --watch=false
          --reporters=junit
          --reporters=default
          --output-file=TestResults/vitest-junit.xml

      - name: Publish frontend test report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Frontend unit tests
          path: frontend/loyeris-app/TestResults/vitest-junit.xml
          reporter: java-junit
          use-actions-summary: true
          only-summary: true

      - name: Build application
        run: yarn build

      - name: Build Storybook
        run: yarn build-storybook

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate local manifest
        run: docker compose --env-file .env.example config --quiet

      - name: Validate development manifest
        run: docker compose --env-file .env.example --file compose.dev.yaml config --quiet

      - name: Validate production manifest
        env:
          IMAGE_TAG: 0000000000000000000000000000000000000000
        run: docker compose --env-file deploy/.env.production.example --file deploy/compose.production.yaml config --quiet

  docker-smoke:
    name: Docker smoke test
    needs:
      - backend
      - frontend
      - compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Pull external service images with retries
        run: |
          for attempt in 1 2 3 4; do
            if docker compose --env-file .env.example pull db maildev; then
              exit 0
            fi

            if [ "$attempt" -eq 4 ]; then
              echo 'Unable to pull PostgreSQL or MailDev after four attempts.' >&2
              exit 1
            fi

            delay=$((attempt * 15))
            echo "Docker Hub pull failed; retrying in ${delay}s." >&2
            sleep "$delay"
          done

      - name: Build and start the complete stack
        run: >-
          docker compose --env-file .env.example up
          --detach
          --build
          --pull never
          --wait
          --wait-timeout 240

      - name: Verify liveness, readiness and SPA fallback
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/health/live
          curl --fail --silent --show-error http://localhost:8080/api/health/ready
          curl --fail --silent --show-error http://localhost:8080/login | grep --quiet '<app-root'
          curl --fail --silent --show-error http://localhost:8080/scis | grep --quiet '<app-root'

      - name: Verify account email delivery through MailDev
        run: |
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"firstName":"Intégration","lastName":"Continue","email":"ci@loyeris.local","password":"Loyeris-CI-2026!","termsAccepted":true}' \
            http://localhost:8080/api/identity-access/accounts

          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:1080/api/email | grep --quiet 'ci@loyeris.local'; then
              exit 0
            fi
            sleep 2
          done

          echo 'MailDev did not receive the account verification email.' >&2
          exit 1

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
